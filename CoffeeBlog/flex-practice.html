<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Practice</title>
     <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <h1>Flexbox Practice</h1>
    <!-- flex-direction-Row-->
   <h2>row + flex-start</h2>
   <div class="flex-container-row-start">
    <p>Child-1</p>
    <p>Child-2</p>
    </div>
    <!-- flex-direction-Row- center-->
   <h2>row + center</h2>
   <div class="flex-container-row-center">
    <p>Child-1</p>
    <p>Child-2</p>
    </div>
    <!-- flex-direction-Row-end -->
   <h2>row + between</h2>
   <div class="flex-container-row-between">
    <p>Child-1</p>
    <p>Child-2</p>
   </div>
   <h2>row + around</h2>
    <div class="flex-container-row-around">
    <p>Child-1</p>
    <p>Child-2</p>
    </div>
    <h2>row + evenly</h2>
     <div class="flex-container-row-evenly">
    <p>Child-1</p>
    <p>Child-2</p>
    </div>
    <h2>row + end</h2>
     <div class="flex-container-row-end">
    <p>Child-1</p>
    <p>Child-2</p>
    </div>

</body>
</html>
